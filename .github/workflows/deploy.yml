name: Deploy to AUR
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write   # needed to commit the version bump back to this repo
concurrency:
  group: deploy-to-aur
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest Polaris release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          JSON=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/papi-ux/polaris/releases/latest)
          VERSION=$(echo "$JSON" | jq -r '.tag_name')
          CLEAN_VERSION="${VERSION#v}"
          if [ -z "$CLEAN_VERSION" ] || [ "$CLEAN_VERSION" = "null" ]; then
            echo "Could not determine latest version, aborting." >&2
            exit 1
          fi
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if update is needed
        id: check
        run: |
          set -e
          CURRENT=$(grep -Po '^pkgver=\K.*' PKGBUILD)
          LATEST="${{ steps.release.outputs.version }}"
          echo "current=$CURRENT"
          echo "latest=$LATEST"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "update=true" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD + SHA256 + depends
        if: steps.check.outputs.update == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          VERSION="${{ steps.release.outputs.version }}"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          # Only reset pkgrel to 1 on a genuine upstream version bump, so a
          # manual workflow_dispatch re-run (e.g. for a packaging-only fix)
          # doesn't stomp a deliberate pkgrel bump back to 1.
          if [ "${{ steps.check.outputs.update }}" = "true" ]; then
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi
          # download the actual release asset so we can hash it -- do NOT
          # rely on sha256sums=('SKIP'), which disables integrity checking
          # entirely and is why this had no verification before
          FILENAME="Polaris-arch-x86_64-${VERSION}.pkg.tar.zst"
          URL="https://github.com/papi-ux/polaris/releases/download/v${VERSION}/Polaris-arch-x86_64.pkg.tar.zst"
          curl -fL --retry 3 -o "$FILENAME" "$URL"
          SHA256=$(sha256sum "$FILENAME" | awk '{print $1}')
          sed -i "s|^sha256sums=.*|sha256sums=('$SHA256')|" PKGBUILD
          # update the source filename to match (versioned, so AUR helpers
          # never reuse a stale cached file from a previous pkgver)
          sed -i "s|^source=(.*|source=(\"${FILENAME}::${URL}\")|" PKGBUILD
          sed -i "s|^noextract=(.*|noextract=(\"${FILENAME}\")|" PKGBUILD
          # Match the FULL quoted argument (opening " through closing ") so
          # nothing gets left dangling behind the replacement -- the prior
          # pattern only matched up through ".zst" and left the original
          # closing quote in place, producing a doubled `""` every run.
          sed -i "s|bsdtar -xf \"[^\"]*\.pkg\.tar\.zst\"|bsdtar -xf \"${FILENAME}\"|" PKGBUILD

          # --- Sync depends=() from upstream metadata, without trusting it blindly ---
          #
          # Upstream's own .PKGINFO has already been shown to be incomplete: it
          # did not declare libayatana-appindicator, even though
          # `polaris --setup-host` fails without it (user-reported on 1.4.7).
          # So we never let this step overwrite depends=() with ONLY what
          # upstream declares. Instead we union:
          #   1. whatever upstream's .PKGINFO says (`depend = ...` lines)
          #   2. extra-depends.txt in this repo, a packager-maintained list of
          #      known-required deps that upstream fails to declare
          # and only ever add to that combined set -- extra-depends.txt is
          # never auto-pruned, so a fix like today's isn't silently undone by
          # the next scheduled run.
          UPSTREAM_DEPS=$(bsdtar -xOf "$FILENAME" .PKGINFO 2>/dev/null \
            | sed -n 's/^depend = //p' || true)

          if [ -z "$UPSTREAM_DEPS" ]; then
            echo "::warning::Could not read .PKGINFO from the release asset; leaving depends=() untouched this run."
          else
            EXTRA_DEPS=$(sed -e '/^\s*#/d' -e '/^\s*$/d' extra-depends.txt 2>/dev/null || true)
            ALL_DEPS=$(printf '%s\n%s\n' "$UPSTREAM_DEPS" "$EXTRA_DEPS" | sed '/^\s*$/d' | sort -u)

            DEPENDS_ARGS=()
            while IFS= read -r dep; do
              DEPENDS_ARGS+=("'$dep'")
            done <<< "$ALL_DEPS"

            DEPENDS_LINE="depends=(${DEPENDS_ARGS[*]})"

            # Sanity check before writing: must look like a well-formed
            # bash array assignment, or bail rather than risk a malformed
            # PKGBUILD getting pushed to the AUR.
            if [[ "$DEPENDS_LINE" =~ ^depends=\(\'.+\'\)$ ]]; then
              OLD_DEPENDS_LINE=$(grep '^depends=' PKGBUILD || true)
              sed -i "s|^depends=.*|$DEPENDS_LINE|" PKGBUILD
              echo "Resolved depends: $DEPENDS_LINE"
              if [ "$OLD_DEPENDS_LINE" != "$DEPENDS_LINE" ]; then
                echo "deps_changed=true" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "::warning::Computed depends=() line looked malformed, leaving PKGBUILD's existing depends=() untouched: $DEPENDS_LINE"
            fi
          fi
        id: depends

      - name: Commit version bump back to repo
        if: steps.check.outputs.update == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD
          if git diff --staged --quiet; then
            echo "No PKGBUILD changes to commit."
          else
            if [ "${{ steps.depends.outputs.deps_changed }}" = "true" ]; then
              git commit -m "Update PKGBUILD (pkgver ${{ steps.release.outputs.version }}, depends changed)"
            else
              git commit -m "Update PKGBUILD (pkgver ${{ steps.release.outputs.version }})"
            fi
            # Rebase onto whatever's currently on origin/main before pushing.
            # Prevents a race where a manual push to main between checkout
            # and this push would otherwise cause a rejected non-fast-forward
            # push.
            git pull --rebase origin main
            git push
          fi

      - name: Clean workspace
        run: |
          rm -f Polaris-arch-x86_64-*.pkg.tar.zst || true
          git clean -fdx

      - name: Deploy to AUR
        if: steps.check.outputs.update == 'true' || github.event_name == 'workflow_dispatch'
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: polaris-gamestream-bin
          pkgbuild: ./PKGBUILD
          assets: |
            polaris-gamestream-bin.install
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_username: ${{ secrets.AUR_COMMIT_USERNAME }}
          commit_email: ${{ secrets.AUR_COMMIT_EMAIL }}
          updpkgsums: false
          allow_empty_commits: false
