name: Deploy to AUR

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the version bump back to this repo

concurrency:
  group: deploy-to-aur
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest Polaris release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          JSON=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/papi-ux/polaris/releases/latest)

          VERSION=$(echo "$JSON" | jq -r '.tag_name')
          CLEAN_VERSION="${VERSION#v}"

          if [ -z "$CLEAN_VERSION" ] || [ "$CLEAN_VERSION" = "null" ]; then
            echo "Could not determine latest version, aborting." >&2
            exit 1
          fi

          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if update is needed
        id: check
        run: |
          set -e

          CURRENT=$(grep -Po '^pkgver=\K.*' PKGBUILD)
          LATEST="${{ steps.release.outputs.version }}"

          echo "current=$CURRENT"
          echo "latest=$LATEST"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "update=true" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD + SHA256 + depends
        id: depends
        if: steps.check.outputs.update == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -e

          VERSION="${{ steps.release.outputs.version }}"

          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD

          # Only reset pkgrel to 1 on a genuine upstream version bump.
          # A manual workflow_dispatch can therefore be used for a
          # packaging-only change without resetting pkgrel.
          if [ "${{ steps.check.outputs.update }}" = "true" ]; then
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

          # Download the actual release asset so we can hash it.
          # Do NOT use sha256sums=('SKIP'), since that disables integrity
          # verification entirely.
          FILENAME="Polaris-arch-x86_64-${VERSION}.pkg.tar.zst"
          URL="https://github.com/papi-ux/polaris/releases/download/v${VERSION}/Polaris-arch-x86_64.pkg.tar.zst"

          curl -fL --retry 3 -o "$FILENAME" "$URL"

          SHA256=$(sha256sum "$FILENAME" | awk '{print $1}')

          sed -i "s|^sha256sums=.*|sha256sums=('$SHA256')|" PKGBUILD

          # Update the source filename to match.
          # Versioned filenames prevent AUR helpers from reusing a stale
          # cached source from a previous pkgver.
          sed -i "s|^source=(.*|source=(\"${FILENAME}::${URL}\")|" PKGBUILD

          sed -i "s|^noextract=(.*|noextract=(\"${FILENAME}\")|" PKGBUILD

          # Match the FULL quoted argument so we don't leave behind an
          # extra quote when replacing the extraction filename.
          sed -i "s|bsdtar -xf \"[^\"]*\.pkg\.tar\.zst\"|bsdtar -xf \"${FILENAME}\"|" PKGBUILD

          # ---------------------------------------------------------------
          # Sync depends=() from upstream metadata
          # ---------------------------------------------------------------
          #
          # Upstream's .PKGINFO contains the dependencies declared by the
          # Polaris binary package.
          #
          # extra-depends.txt contains dependencies that we know are required
          # but which upstream may fail to declare.
          #
          # The two lists are merged and deduplicated.
          #
          # extra-depends.txt is intentionally never auto-pruned, so a
          # manually discovered dependency cannot silently disappear on the
          # next upstream release.
          # ---------------------------------------------------------------

          echo "Extracting dependencies from upstream .PKGINFO..."

          # GNU tar on ubuntu-latest supports .tar.zst archives.
          # Extract only the .PKGINFO file and collect all `depend =` entries.
          UPSTREAM_DEPS=$(tar -xOf "$FILENAME" .PKGINFO |
            sed -n 's/^depend = //p')

          if [ -z "$UPSTREAM_DEPS" ]; then
            echo "::error::Could not read .PKGINFO or no dependencies were found in the release asset."
            echo "::error::Refusing to update PKGBUILD with an unknown dependency list."
            exit 1
          fi

          echo "Upstream dependencies:"
          printf '%s\n' "$UPSTREAM_DEPS"

          # Read packager-maintained dependencies.
          EXTRA_DEPS=$(sed \
            -e '/^[[:space:]]*#/d' \
            -e '/^[[:space:]]*$/d' \
            extra-depends.txt 2>/dev/null || true)

          echo "Extra packager dependencies:"
          printf '%s\n' "$EXTRA_DEPS"

          # Merge both lists, remove blank lines, and deduplicate.
          ALL_DEPS=$(printf '%s\n%s\n' "$UPSTREAM_DEPS" "$EXTRA_DEPS" |
            sed '/^[[:space:]]*$/d' |
            sort -u)

          echo "Combined dependencies:"
          printf '%s\n' "$ALL_DEPS"

          # Convert the dependency list into a PKGBUILD array:
          #
          # depends=('avahi' 'bash' 'boost-libs' ...)
          DEPENDS_ARGS=()

          while IFS= read -r dep; do
            DEPENDS_ARGS+=("'$dep'")
          done <<< "$ALL_DEPS"

          DEPENDS_LINE="depends=(${DEPENDS_ARGS[*]})"

          # Sanity check before modifying PKGBUILD.
          if [[ "$DEPENDS_LINE" =~ ^depends=\(\'.+\'\)$ ]]; then

            OLD_DEPENDS_LINE=$(grep '^depends=' PKGBUILD || true)

            sed -i "s|^depends=.*|$DEPENDS_LINE|" PKGBUILD

            echo "Resolved depends:"
            echo "$DEPENDS_LINE"

            if [ "$OLD_DEPENDS_LINE" != "$DEPENDS_LINE" ]; then
              echo "deps_changed=true" >> "$GITHUB_OUTPUT"
            fi

          else
            echo "::error::Computed depends=() line looked malformed:"
            echo "$DEPENDS_LINE"
            exit 1
          fi

      - name: Commit version bump back to repo
        if: steps.check.outputs.update == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add PKGBUILD

          if git diff --staged --quiet; then
            echo "No PKGBUILD changes to commit."
          else
            if [ "${{ steps.depends.outputs.deps_changed }}" = "true" ]; then
              git commit -m "Update PKGBUILD (pkgver ${{ steps.release.outputs.version }}, depends changed)"
            else
              git commit -m "Update PKGBUILD (pkgver ${{ steps.release.outputs.version }})"
            fi

            # Rebase onto whatever is currently on origin/main before
            # pushing, preventing a race with a manual push to main.
            git pull --rebase origin main
            git push
          fi

      - name: Clean workspace
        run: |
          rm -f Polaris-arch-x86_64-*.pkg.tar.zst || true
          git clean -fdx

      - name: Deploy to AUR
        if: steps.check.outputs.update == 'true' || github.event_name == 'workflow_dispatch'
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: polaris-gamestream-bin
          pkgbuild: ./PKGBUILD
          assets: |
            polaris-gamestream-bin.install
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_username: ${{ secrets.AUR_COMMIT_USERNAME }}
          commit_email: ${{ secrets.AUR_COMMIT_EMAIL }}
          updpkgsums: false
          allow_empty_commits: false
